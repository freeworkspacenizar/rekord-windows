name: Build Rekord (Windows x64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch LGPL FFmpeg (win64-lgpl)
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Run unit tests & build portable app
        shell: pwsh
        run: ./scripts/build-app.ps1

      - name: Build Inno Setup installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rekord-win-x64-portable
          path: dist/Rekord-win-x64-portable.zip
          if-no-files-found: error

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Rekord-win-x64-installer
          path: dist/Rekord-Setup.exe
          if-no-files-found: error
